<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Text Launcher</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--fg:#111;--mut:#666;--bd:#ddd;--acc:#1f4d2b;--btn:#111;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--card:#161616;--fg:#f2f2f2;--mut:#a3a3a3;--bd:#2c2c2c;--acc:#d4ff00;--btn:#d4ff00;--btnfg:#111;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px max(16px,env(safe-area-inset-left)) 28px max(16px,env(safe-area-inset-right))}
main{max-width:520px;margin:0 auto}
.k{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
h1{font-size:22px;margin:0 0 2px}
.num{color:var(--mut);margin:0 0 14px}
.msg{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;white-space:pre-wrap;word-wrap:break-word;margin:0 0 16px}
a.go,button{display:block;width:100%;text-align:center;border-radius:8px;padding:16px;font:700 17px system-ui,sans-serif;text-decoration:none;cursor:pointer}
a.go{background:var(--btn);color:var(--btnfg);border:0;margin:0 0 10px}
button{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.note{color:var(--mut);font-size:13px;margin-top:14px}
.err{color:var(--mut)}
</style>
</head>
<body>
<main id="app"><p class="err">Nothing to open. Use a link from your Texts to send email.</p></main>
<script>
(function(){
  // Everything comes from the part of the link after "#", which the browser never sends to any server.
  var h = location.hash.replace(/^#/, "");
  var p; try { p = new URLSearchParams(h); } catch (e) { return; }
  var digits = String(p.get("n") || "").replace(/[^\d]/g, "");
  if (digits.length === 10) digits = "1" + digits;
  if (!/^1\d{10}$/.test(digits)) return;
  var num = "+" + digits;
  var body = String(p.get("b") || "").slice(0, 1000);
  var who = String(p.get("w") || "").slice(0, 80);
  var shop = String(p.get("s") || "").slice(0, 80);
  var href = "sms:" + num + (body ? "?body=" + encodeURIComponent(body) : "");
  var pretty = "(" + digits.slice(1,4) + ") " + digits.slice(4,7) + "-" + digits.slice(7);
  var app = document.getElementById("app");
  app.textContent = "";
  function el(tag, cls, txt){ var x = document.createElement(tag); if (cls) x.className = cls; if (txt != null) x.textContent = txt; return x; }
  app.appendChild(el("p", "k", shop || "Text"));
  app.appendChild(el("h1", "", who || pretty));
  app.appendChild(el("p", "num", who ? pretty : ""));
  if (body) app.appendChild(el("div", "msg", body));
  var a = el("a", "go", "Open in Messages"); a.href = href; app.appendChild(a);
  if (body) {
    var b = el("button", "", "Copy text");
    b.addEventListener("click", function(){
      var done = function(){ b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy text"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(body).then(done, function(){ sel(); });
      else sel();
      function sel(){ var r = document.createRange(); r.selectNodeContents(document.querySelector(".msg")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    });
    app.appendChild(b);
  }
  app.appendChild(el("p", "note", "Nothing is sent until you hit send in Messages. This page stores nothing."));
})();
</script>
</body>
</html>
